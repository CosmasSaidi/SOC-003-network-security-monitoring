# ---------------------------------------------------------------------------
# SOC-003 lab anomaly-noise tuning threshold config -- PHASE 4D
#
# What is tuned
#   Noise rate-limits for the three Suricata-provided packet-anomaly rules that
#   fire on sender-side TCP/IP checksum-offload artifacts in this lab's guest
#   capture path (WS001 windows guest on the VirtualBox host-only network):
#
#     gen_id 1, sig_id 2200073  SURICATA IPv4  invalid checksum
#     gen_id 1, sig_id 2200074  SURICATA TCPv4 invalid checksum
#     gen_id 1, sig_id 2200075  SURICATA UDPv4 invalid checksum
#
# Why (evidence)
#   Phase 4C Step 3 / Phase 4D measured replays of the benign Phase 3D
#   WS001<->DC1 capture produced 544 alerts (712 packets, 272 corrupt packets,
#   2 rules per packet) entirely in the guest->host direction, from a benign
#   capture. Cause measured independently with tshark, an RFC-1071
#   recomputation script and a checksum-fix replay experiment:
#   evidence/phase4c-ruleset/analysis/alert-analysis-phase3d-checksums.md and
#   evidence/phase4c-ruleset/analysis/checksum-experiment/.
#   The packets are genuine capture artifacts, not anomalies introduced by any
#   tested malicious behaviour; no ET Open vendor signature ever fired.
#
# Exact scope
#   gen_id 1 (rule generator), sig_id 2200073/2200074/2200075 ONLY.
#   Track by_src (the offload artifact is a property of the sending host).
#   Limit: first alert per source per rule per 3600 s window.
#   Measured effect on the Phase 3D capture: 544 -> 3 alerts (one per rule).
#   Measured effect on every other tested capture: none (they produce no
#   anomaly alerts).
#
# What visibility is lost
#   Per-packet anomaly counts within each 1-hour per-source window. The first
#   anomaly per source per rule still alerts, so continued presence of the
#   artifact remains visible. True per-packet checksum statistics remain
#   available from the capture file itself (tshark/capinfos), NOT from alert
#   counts -- Phase 4B showed threshold semantics already make alert counts
#   unsuitable as event counts.
#
# Why lab-specific
#   The artifact is tied to this lab's VirtualBox guest capture path. On a
#   production span port or a capture path without TX checksum offload these
#   rules would not fire on benign traffic, and rate-limiting them could delay
#   or hide genuine packet-corruption/injection signals. This file is NOT
#   deployed to the system: /etc/suricata is not modified and the managed ET
#   Open ruleset is not modified.
#
# How to enable (lab only, engine-level, no config-file edit)
#   suricata -c /etc/suricata/suricata.yaml \
#     --set threshold-file=$HOME/soc-lab/soc-003/detections/suricata/soc003-lab-anomaly-thresholds.conf \
#     ... (offline replay flags: -r <pcap> -l <outdir>)
#   The engine logs "Threshold config parsed: 3 rule(s) found".
#   NOTE (Suricata 8): entries must NOT end with ';' -- a trailing semicolon
#   causes a pcre2 parse error and the whole threshold file is rejected
#   (measured on Suricata 8.0.7, Phase 4D).
#
# How to reverse
#   Do not pass the --set threshold-file argument (or remove the file). No
#   persistent configuration change exists to undo.
#
# Author: saidi (hand-written for SOC-003 Phase 4D)
# ---------------------------------------------------------------------------

threshold gen_id 1, sig_id 2200073, type limit, track by_src, count 1, seconds 3600
threshold gen_id 1, sig_id 2200074, type limit, track by_src, count 1, seconds 3600
threshold gen_id 1, sig_id 2200075, type limit, track by_src, count 1, seconds 3600
